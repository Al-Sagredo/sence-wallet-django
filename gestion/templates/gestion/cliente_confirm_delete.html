{% extends 'gestion/base.html' %}

{% block title %}Eliminar Cliente | Sence Wallet{% endblock %}

{% block content %}
<div class="aw-dashboard aw-auth-wrapper">
    <div class="aw-card aw-auth-card text-center">
        <i class="bi bi-exclamation-triangle text-warning fs-1 mb-3 d-block"></i>
        <h2 class="aw-form-title mb-2">¿Eliminar Cliente?</h2>
        <p class="text-muted mb-4">
            Estás a punto de eliminar a <strong>{{ cliente.nombre }}</strong>. Esta acción no se puede deshacer.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="aw-form-actions">
                <button type="submit" class="aw-btn-danger aw-btn-block">
                    <i class="bi bi-trash"></i> Confirmar Eliminación
                </button>
                <a href="{% url 'cliente_list' %}" class="aw-btn-outline aw-btn-block">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
