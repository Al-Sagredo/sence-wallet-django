{% extends 'gestion/base.html' %} {% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-8">
        <h1>Iniciar Sesión</h1>
        <div class="card aw-card aw-auth-card p-4">
            <div class="text-center mb-3">
                <i class="bi bi-wallet2 fs-1"></i>
                <h2 class="mt-2 mb-0">Sence Wallet</h2>
                
            </div>
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{field.id_for_label}}" class="form label">{{field.label}}</label>
                        {{field}}
                    </div>
                {% endfor %}
                <button type="submit" class="btn aw-btn-primary w-100 mt-3"> Ingresar</button>
            </form>
            <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">
                        ¿No tienes una cuenta? 
                        <a href="{% url 'registro' %}" class="text-decoration-none">Regístrate aquí</a>
                    </p>
                </div>
            
        </div>
    </div>
    {% endblock %}
</div>
